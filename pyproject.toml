[project]
name = "dadi-ki-rasoi"
version = "1.0.0"
description = "Dadi Ki Rasoi Django application"
requires-python = ">=3.13"
dependencies = [
  "Django==6.0.2",
  "Pillow>=11.0,<12.0",
  "dj-database-url>=2.3,<3.0",
  "psycopg[binary]>=3.2,<4.0",
]

[tool.vercel.scripts]
build = "python manage.py migrate --noinput && python manage.py collectstatic --noinput"
